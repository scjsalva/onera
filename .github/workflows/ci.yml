name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/onera_test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Prepare the database
        run: bin/rails db:prepare

      - name: Autoload check
        run: bin/rails zeitwerk:check

      - name: Build assets
        run: |
          npx vite build
          bin/vite build --mode test

      - name: Lint
        run: bin/rubocop

      - name: Security scan
        run: bin/brakeman -q -w2 --no-summary --no-pager

      - name: Ruby tests
        run: bin/rails test

      - name: JavaScript tests
        run: npx vitest run
