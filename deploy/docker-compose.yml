# What runs on the box. Two containers: the app, and Caddy in front of it
# holding the certificate.
#
# There is no Postgres here on purpose. The database lives on Neon, which
# backs it up and can be reached from anywhere - so losing this machine costs
# an afternoon of setup, not the data.

services:
  web:
    image: ${ONERA_IMAGE:-ghcr.io/scjsalva/onera:latest}
    restart: always
    env_file: .env
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      # One worker, three threads. The micro has a single core and 1 GB, and a
      # second worker buys nothing when every request waits on a remote
      # database anyway.
      WEB_CONCURRENCY: "1"
      RAILS_MAX_THREADS: "3"
      PORT: "80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
