# One-click deploy: https://render.com/deploy?repo=https://github.com/scjsalva/onera
#
# Web service on Render's free instance type, database on Neon's free tier.
# Deliberately not a Render Postgres: theirs expires after a month, and the
# whole point is that the data outlives the trial.
#
# The free web instance sleeps after about 15 minutes idle and wakes on the
# next request, so the first visit after a quiet spell takes a few seconds.
services:
  - type: web
    name: onera
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SECRET_KEY_BASE
        generateValue: true
      # Set to the host Render gives you, e.g. onera.onrender.com
      - key: APP_HOST
        sync: false
      # Neon connection string, including ?sslmode=require
      - key: DATABASE_URL
        sync: false
