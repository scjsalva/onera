<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Onera">
  <!-- The Onera mark: one solid circle and a second implied by an arc - two
       people, one shared cost. -->
  <rect width="64" height="64" rx="15" fill="#2b62f0"/>
  <circle cx="26" cy="32" r="13" fill="none" stroke="#ffffff" stroke-width="5.5"/>
  <path d="M38 19a13 13 0 0 1 0 26" fill="none" stroke="#ffffff" stroke-width="5.5"
        stroke-linecap="round" opacity="0.55"/>
</svg>
